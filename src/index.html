<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive map of contributor affiliations in the Last Translation Benchmark.">
  <title>Affiliation map · Last Translation Benchmark</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="canonical" href="https://lvu5.github.io/translation_viz/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Last Translation Benchmark">
  <meta property="og:title" content="Contributor Affiliation Map">
  <meta property="og:description" content="Explore contributor affiliations and accepted submissions in the Last Translation Benchmark.">
  <meta property="og:url" content="https://lvu5.github.io/translation_viz/">
  <meta property="og:image" content="https://lvu5.github.io/translation_viz/assets/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Last Translation Benchmark contributor affiliation map">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contributor Affiliation Map">
  <meta name="twitter:description" content="Explore contributor affiliations and accepted submissions in the Last Translation Benchmark.">
  <meta name="twitter:image" content="https://lvu5.github.io/translation_viz/assets/social-preview.png">
  
</head>

<body>
  <header class="site-header">
    <a class="site-brand" href="https://last-translation-benchmark.vilda.net/" target="_blank" rel="noreferrer">
      <img src="assets/favicon.svg" alt="">
      <span>Last Translation Benchmark</span>
    </a>
    <a class="site-link" href="https://last-translation-benchmark.vilda.net/dashboard" target="_blank" rel="noreferrer">
      Public dashboard
    </a>
  </header>

  <main class="site-shell">
    <section class="affiliation-map-section" aria-label="Contributor affiliation map">
      <div class="affiliation-map-stage">
        <div
          id="affiliation-map"
          role="application"
          aria-label="Interactive map of contributor affiliation locations, initially showing Europe"
        ></div>

        <details class="affiliation-map-toolbox">
          <summary>
            <span>Explore</span>
            <span id="map-filter-status"></span>
          </summary>
          <div class="affiliation-map-toolbox-content">
            <dl class="affiliation-map-stats" aria-label="Public dashboard totals">
              <div>
                <dt>Total submissions</dt>
                <dd id="map-total-submissions">—</dd>
              </div>
              <div>
                <dt>Contributors</dt>
                <dd id="map-contributor-count">—</dd>
              </div>
            </dl>
            <label for="map-affiliation-filter">
              Affiliation
              <input id="map-affiliation-filter" type="search" list="map-affiliation-options" placeholder="Search or select" autocomplete="off">
              <datalist id="map-affiliation-options"></datalist>
            </label>
            <label for="map-country-filter">
              Country
              <select id="map-country-filter">
                <option value="">All countries</option>
              </select>
            </label>
            <div class="affiliation-map-actions">
              <button class="affiliation-map-reset" type="button" id="map-reset" aria-label="Reset filters and map view">↺</button>
            </div>
          </div>
        </details>

        <div class="affiliation-map-loading" id="affiliation-map-loading" role="status">
          Loading dashboard data…
        </div>
      </div>


      <div class="affiliation-map-detail" id="affiliation-map-detail" aria-live="polite">
        Select an institution logo to inspect its contributors.
      </div>

      <section class="affiliation-leaderboard" aria-labelledby="affiliation-leaderboard-heading">
        <div class="affiliation-leaderboard-heading">
          <h2 id="affiliation-leaderboard-heading">Top affiliations</h2>
          <span>By accepted submissions</span>
        </div>
        <ol class="affiliation-leaderboard-list" id="affiliation-leaderboard-list"></ol>
      </section>

      <footer class="map-footer">
        <span id="snapshot-status">Preparing public dashboard snapshot…</span>
      </footer>
    </section>
  </main>
</body>

</html>
